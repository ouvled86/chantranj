<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Study — Chess Improvement for Casual Players</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark">♞</div>
      <div class="brand-text">
        <h1>The Study</h1>
        <p>Chess beyond the rules</p>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div id="progress-summary"></div>
      <button id="reset-progress" class="ghost-btn" title="Clear all progress">Reset progress</button>
    </div>
  </aside>

  <button id="sidebar-toggle" aria-label="Toggle curriculum">☰ Curriculum</button>

  <main id="main">
    <header id="lesson-head">
      <div class="eyebrow" id="head-eyebrow"></div>
      <h2 id="head-title"></h2>
      <p id="head-sub"></p>
    </header>

    <section id="stage">
      <div id="board-column">
        <div id="turn-chip" class="turn-chip"></div>
        <div id="board-frame">
          <div id="board"></div>
          <svg id="overlay" viewBox="0 0 800 800" preserveAspectRatio="none"></svg>
        </div>
        <div id="board-caption"></div>
      </div>

      <div id="panel">
        <div id="note-card" class="note-card">
          <div class="note-label" id="note-label"></div>
          <div class="note-body" id="note-body"></div>
        </div>

        <div id="feedback" class="feedback hidden"></div>

        <div id="controls" class="controls"></div>

        <div id="movelist-wrap">
          <div class="movelist-label">Moves</div>
          <div id="movelist"></div>
        </div>

        <div id="item-nav" class="item-nav"></div>
      </div>
    </section>
  </main>
</div>
<script src="js/engine.js"></script>
<script src="js/content.js"></script>
<script src="js/app.js"></script>
</body>
</html>
