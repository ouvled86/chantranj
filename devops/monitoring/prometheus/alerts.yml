groups:
  - name: the-study
    rules:
      - alert: HighServerErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 1) > 0.05
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "5xx error rate above 5% for 5m"

      - alert: HighRequestLatencyP95
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 1.0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "API p95 latency above 1s for 10m"

      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "Backend is not being scraped (down?)"

      - alert: NoRecentGames
        # Sanity signal for prod: instrument-your-product example alert.
        expr: absent(http_requests_total)
        for: 15m
        labels: { severity: info }
        annotations:
          summary: "No HTTP metrics at all — instrumentation or traffic problem"
