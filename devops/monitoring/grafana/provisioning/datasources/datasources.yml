apiVersion: 1

datasources:
  # Infra RED metrics.
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  # Game telemetry — the homelab mirror: query the TimescaleDB hypertables
  # (move_events, rating_history, engine_samples, activity_events) directly.
  - name: TimescaleDB
    type: postgres
    uid: timescaledb
    access: proxy
    url: timescaledb:5432
    user: ${POSTGRES_USER}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
