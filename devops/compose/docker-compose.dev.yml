name: the-study-dev

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-study}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-study_dev}
      POSTGRES_DB: ${POSTGRES_DB:-study}
    ports:
      - "5432:5432"
    volumes:
      - tsdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-study} -d ${POSTGRES_DB:-study}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../..
      dockerfile: devops/containers/backend.Dockerfile
      target: dev
    environment:
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-study}:${POSTGRES_PASSWORD:-study_dev}@timescaledb:5432/${POSTGRES_DB:-study}
      REDIS_URL: redis://redis:6379/0
      ENGINE_URL: http://engine:9000
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret}
    volumes:
      - ../../backend/app:/app/app
      - ../../backend/tests:/app/tests
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: devops/containers/backend.Dockerfile
      target: dev
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info"]
    environment:
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-study}:${POSTGRES_PASSWORD:-study_dev}@timescaledb:5432/${POSTGRES_DB:-study}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../../backend/app:/app/app
    depends_on:
      redis:
        condition: service_healthy

  engine:
    build:
      context: ../..
      dockerfile: devops/containers/engine.Dockerfile
      target: dev
    volumes:
      - ../../engine/app:/app/app
      - ../../engine/tests:/app/tests
    ports:
      - "9000:9000"

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_POLL: "1"
    volumes:
      - ../../frontend:/app
      # Keep the container's Linux node_modules OUT of the host bind mount: it
      # installs as root (breaking `npm ci` on the CI runner with EACCES) and its
      # native binaries are not the host's. Each side gets its own tree.
      - /app/node_modules
    ports:
      - "5173:5173"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    depends_on:
      - timescaledb

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ../monitoring/prometheus:/etc/prometheus:ro
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      POSTGRES_USER: ${POSTGRES_USER:-study}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-study_dev}
      POSTGRES_DB: ${POSTGRES_DB:-study}
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - timescaledb

volumes:
  tsdata:
